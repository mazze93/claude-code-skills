name: verify

# This repo had no CI at all: a syntax error in a hook, a skill with broken
# frontmatter, or a dead reference would ship silently and only surface as
# "why did my hook stop firing?" weeks later. Everything here is cheap and
# runs on push as well as PR, so red is visible immediately.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest ships bash but not zsh, and most of these hooks are zsh.
      # Without this the syntax step reports "command not found" as a failure
      # for every zsh script.
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Shell syntax (each script with its own interpreter)
        run: |
          set -euo pipefail
          fail=0
          for f in hooks/*.sh config/*.sh bootstrap/bootstrap.sh bootstrap/lib/*.sh; do
            [ -f "$f" ] || continue
            case "$(head -1 "$f")" in
              *zsh*) checker="zsh -n" ;;
              *)     checker="bash -n" ;;
            esac
            if $checker "$f"; then
              echo "ok   $f ($checker)"
            else
              echo "FAIL $f ($checker)"; fail=1
            fi
          done
          exit $fail

      - name: Skill frontmatter is well-formed
        run: |
          set -euo pipefail
          fail=0
          for d in skills/*/; do
            f="$d/SKILL.md"
            [ -f "$f" ] || { echo "FAIL $d — no SKILL.md"; fail=1; continue; }
            head -1 "$f" | grep -qx -- '---' || { echo "FAIL $f — missing opening ---"; fail=1; continue; }
            grep -qE '^name:' "$f"        || { echo "FAIL $f — no name:"; fail=1; }
            grep -qE '^description:' "$f" || { echo "FAIL $f — no description:"; fail=1; }
            echo "ok   $f"
          done
          exit $fail

      - name: Vendored Apache-2.0 skills keep LICENSE and NOTICE
        run: |
          set -euo pipefail
          fail=0
          # Apache-2.0 section 4 requires the license and a statement of changes
          # to travel with the work. Losing either in a refactor is a licensing
          # problem, not a cosmetic one.
          for d in skills/cloudflare skills/cloudflare-one skills/web-perf; do
            for f in LICENSE NOTICE; do
              [ -f "$d/$f" ] && echo "ok   $d/$f" || { echo "FAIL $d/$f missing"; fail=1; }
            done
          done
          exit $fail

      - name: Bootstrap is dry-run clean
        run: bash bootstrap/bootstrap.sh --dry-run

  # The marketplace layer. Each gate exists because of a failure that already
  # happened: a plugin/skill name collision (caught on the validator's first
  # run), a generated artefact hand-edited into drift, and an installer writing
  # a pre-consolidation copy over two SKILL.md files that read as new work.
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # check_revert needs history, not a shallow clone
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generated artefacts match the map
        run: python3 scripts/build_marketplace.py --check

      - name: Collisions, orphans, frontmatter
        run: python3 scripts/validate_marketplace.py

      - name: No change silently restores an older version of itself
        run: python3 scripts/check_revert.py --all

  # The storefront. It reads .claude-plugin/skill-map.json and every SKILL.md
  # frontmatter at BUILD time, so a broken frontmatter or a plugin claiming a
  # missing skill fails here rather than shipping a blank card. fetch-depth: 0
  # because the "new" badge is derived from each skill's first commit date.
  store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci || npm install
        working-directory: site
      # NOT `astro check`: it peers on typescript ^5||^6 and this project runs
      # TypeScript 7 (latest). It also prompts interactively to self-install,
      # which hangs a runner rather than failing it. tsc covers .ts/.tsx and
      # `astro build` validates .astro. Revisit when @astrojs/check supports TS7.
      - name: Typecheck
        run: npm run typecheck
        working-directory: site
      - name: Build
        run: npm run build
        working-directory: site
