name: core-sample evidence verification
on:
  pull_request:
    paths:
      - 'skills/core-sample/**'
      - '.github/workflows/core-sample-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit and evidence-integration tests
        working-directory: skills/core-sample/scripts
        run: python3 -m unittest discover -s tests -v
