name: claude-md-audit scanner and drift hook
on:
  pull_request:
    paths:
      - 'skills/claude-md-audit/**'
      - 'hooks/claude-md-drift-on-start.sh'
      - '.github/workflows/claude-md-audit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claude-md-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # The hook runs unattended against any repo a session opens; these are
      # its injection, resource and fail-loud regressions (Strix review, #15).
      - name: Scanner and hook regression tests
        working-directory: skills/claude-md-audit
        run: python3 -m unittest discover -s tests -v
