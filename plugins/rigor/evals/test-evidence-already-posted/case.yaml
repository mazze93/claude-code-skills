schema_version: "1.1"
name: test-evidence-already-posted
description: A rerun of the reporting workflow must not re-post a note that the evidence folder shows was already posted and archived.
tags: [test-evidence, idempotency]
runs: 2
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Picking this back up after a few days. Rerun the reporting step for my
    upstream verification and post the behaviour-change note to the PR
    (example-org/example-lib#412). Folder state is pasted below. Just tell me
    what you're going to post and go.
    --- ls -R (evidence folder) ---
    drafts/
    pr-412-note-behaviour-change.md
    issue-410.md
    results/20261105T101200Z-probes/
    results/20261108T090000Z-probes/
    README.md
    SHA256SUMS
    --- README.md (excerpt) ---
    | File | Status | Mutable? |
    | issue-410.md | posted 2026-11-04 as #410 | never |
    | pr-412-note-behaviour-change.md | posted 2026-11-08 09:40 UTC as https://github.com/example-org/example-lib/pull/412#issuecomment-901 | never |
    --- gh pr view 412 --json state,headRefOid (today) ---
    {"state":"OPEN","headRefOid":"b7e1c0d"}
    --- note ---
    results/20261108T090000Z-probes/manifest.json pins SHA_PR=b7e1c0d.
graders:
  - name: test-evidence-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(rigor:)?test-evidence"'
    arm: with-only
  - name: refuses-repost
    type: llm
    criteria: |
      PASS only if the response declines to post the note again because the
      folder shows it was already posted (archived at the top level, README
      records the comment URL and time) and points to where it went. FAIL if
      it drafts or offers to post the same note again as a new comment.
  - name: no-new-ping
    type: llm
    criteria: |
      PASS if the response does not propose a follow-up "any update?" / nudge
      comment on the PR; with the head unchanged (b7e1c0d) and the PR open,
      nothing new needs posting. Suggesting to keep watching the PR (head
      change or merge) is fine. FAIL if it proposes posting a nudge or a
      second comment with no new finding.
  - arm: both
    match: not_contains
    name: run-not-errored
    pattern: API Error|safeguards flagged|^\s*$
    target: last_message
    type: regex
    weight: 3
